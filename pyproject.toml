[project]
name = "athlete-report"
version = "0.1.0"
description = "Reportes semanales de entrenamiento con snapshots históricos congelados"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=15",
    "jinja2>=3.1",
]

[project.optional-dependencies]
fit = ["fitdecode>=0.10"]

[project.scripts]
athlete-report = "athlete_report.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athlete_report"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
